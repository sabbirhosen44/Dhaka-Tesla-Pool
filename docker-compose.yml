version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dhaka_tesla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tesla_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tesla_admin} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  tesla_network:
    driver: bridge

volumes:
  postgres_data:
